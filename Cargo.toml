[package]
name = "api-rust"
version = "3.3.1"
edition = "2021"
description = "Interactive CLI client for CommerceOS API"
repository = "https://github.com/byheads/commerceos-api-client"
license = "MIT"

[[bin]]
name = "api"
path = "src/main.rs"

[dependencies]
# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# HTTP client (using rustls for cross-compilation without system OpenSSL)
reqwest = { version = "0.13", features = ["blocking", "json", "charset", "http2", "rustls-no-provider"], default-features = false }

# TLS, set up by hand in `tls_config`: reqwest's own `rustls` feature brings
# aws-lc-rs, which needs cmake and a C compiler per cross-compiled target, and
# verifies against the OS trust store. ring cross-compiles with the linkers in
# .cargo/config.toml, and the bundled Mozilla roots keep a binary working where
# no certificates are installed (a bare container).
rustls = { version = "0.23", features = ["ring", "std", "tls12"], default-features = false }
webpki-roots = "1"

# Body decoding, the way reqwest's own `text()` does it (already in its tree)
encoding_rs = "0.8"

# JSON handling
serde = { version = "1", features = ["derive"] }
# `arbitrary_precision`: a number is kept as the digits it was written with, so
# a body that is read and written again (`> file`, `--export`, a glob body)
# holds the values it came with, not the nearest `f64`.
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }

# Terminal handling
crossterm = "0.27"

# Display width of a character in terminal columns (CJK and most emoji take
# two, a combining mark none), for everything the prompt lays out. Pure Rust.
unicode-width = "0.2"

# Base64 encoding for Basic auth
base64 = "0.21"

# Clipboard, text only (no image support). `wayland-data-control` copies on a
# Wayland desktop without going through XWayland; X11 is always there.
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }

# Home directory expansion
dirs = "5"

# File globbing for @file bodies
glob = "0.3"

# Colored output for non-TUI mode
colored = "2"

# Platform keychain for credential storage (macOS Keychain, Windows Credential Manager, Linux file-based)
# Note: sync-secret-service requires dbus which doesn't cross-compile, so we use linux-native (file-based) for Linux
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }

# `import archive`: checksum and unpacking of a downloaded .tar.gz / .tar / .zip
# (all pure Rust, so the cross-compiled targets need no system libraries)
sha2 = "0.10"
flate2 = "1"
tar = { version = "0.4", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

# An interrupt (ctrl+c, `kill`) during a streamed `> file` has to remove the
# partial file before the run ends: see `watch_for_interrupt`. Nothing new is
# built for it: crossterm depends on all three already.
[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["consoleapi"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
# Pseudo-terminal for driving the interactive prompt in tests
libc = "0.2"
# The parser Sublime Text's syntax format was written for, to hold
# editors/sublime/API.sublime-syntax to editors/sample.api in tests/editors.rs.
# `regex-fancy` is the pure Rust engine: nothing in C to build.
syntect = { version = "5", default-features = false, features = ["parsing", "yaml-load", "regex-fancy"] }
# The engine syntect uses, to compile every pattern of the TextMate grammar
fancy-regex = "0.16"
# A throwaway certificate for the local https server in tests/cli.rs
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }

# Fast release builds for development (cargo build --release)
[profile.release]
opt-level = 2
lto = "thin"
strip = true

# Fully optimized distribution builds (cargo build --profile dist)
[profile.dist]
inherits = "release"
opt-level = 3
lto = true
